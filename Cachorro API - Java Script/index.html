<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar cachorro aleatório</title>
    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #eaf4ff;
    color: #243b53;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    background-color: #2878b5;
    color: white;
    text-align: center;
    padding: 35px 20px;
}

header h1 {
    font-size: 35px;
    margin-bottom: 10px;
}

header p {
    font-size: 16px;
}

main {
    background-color: white;
    width: 90%;
    max-width: 550px;
    margin: 50px auto;
    padding: 35px;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}

h2 {
    margin-bottom: 25px;
    color: #2878b5;
}

.foto {
    margin-bottom: 25px;
}

img {
    width: 100%;
    max-width: 350px;
    max-height: 350px;
    object-fit: contain;
    border-radius: 12px;
}

button {
    background-color: #2878b5;
    color: white;
    border: none;
    padding: 15px 30px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background-color: #185783;
}

footer {
    background-color: #2878b5;
    color: white;
    text-align: center;
    padding: 18px;
    margin-top: auto;
}

    </style>

</head>
<body>

    <h1>Buscar cachorros</h1>

    <button id="buscar">Mostrar cachorro</button>

    <div>
        <img 
            id="cachorro" 
            alt="Foto aleatória"
            width="300"
        >
    </div>

    <script src="script.js"></script>

</body>
</html>
